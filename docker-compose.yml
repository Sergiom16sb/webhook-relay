# docker-compose for the webhook relay.
# Usage:
#   docker compose up           # start api + postgres
#   docker compose up -d        # detached
#   docker compose down         # stop
#   docker compose logs -f api  # tail logs
#
# Required env vars (set in .env or shell):
#   POSTGRES_PASSWORD — postgres password (defaults to "devpassword")
#   WEBHOOK_SECRET    — HMAC secret for /events (required in production)
#   DATABASE_URL      — postgres connection string (set by compose for api)

services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Port 5433 on host → 5432 in container. If 5432 on host is taken
    # by another project (e.g. payments-postgres), the API still connects
    # to the in-network DNS name `postgres:5432` below.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-api
    environment:
      DATABASE_URL: postgres://webhook:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/webhook?sslmode=disable
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PORT: 8080
    ports:
      # Host 8080 → container 8080.
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "--healthcheck-only"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: webhook-postgres-data
    driver: local
